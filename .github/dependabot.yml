# Supply-chain updates, per conventions.md §6 and platform-operations.md FR-CICD-010.
#
# FROZEN 2026-09-05. Every ecosystem below carries `open-pull-requests-limit: 0` — GitHub's
# documented switch for turning version updates off without deleting the configuration that
# describes them. Dependabot opened PRs faster than a solo project merges them, and the
# resulting backlog of open PRs and orphaned branches cost more attention than the bumps were
# worth this early. The groups and every `ignore` entry are kept deliberately: each records
# *why* a pin is a decision rather than neglect, and that reasoning outlives the freeze.
# Re-enabling is restoring the limits, nothing else.
#
# Trivy scanning is wired by IMP-M0-11 with the rest of the shared pipeline; this file is
# the half that is pure configuration and therefore cheaper to land now than to remember
# later.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      build-tooling:
        patterns:
          - com.diffplug.spotless:*
          - com.google.errorprone:*
          - com.uber.nullaway:*
          - org.jacoco:*
          - org.apache.maven.plugins:*
          - com.puppycrawl.tools:*
      test:
        patterns:
          - org.junit*
          - org.assertj:*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint@8.68.0's peer range is ">=4.8.4 <6.1.0" (IMP-M0-02) — TypeScript
      # 6.1+ (and the TS 7 native-compiler line) fails npm install with ERESOLVE. 6.0.3 is
      # a deliberate pin, not a stale one; moving past 6.1 needs a typescript-eslint bump
      # in the same change, which Dependabot cannot coordinate across two packages.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # jsdom 30.x's own `engines` field requires Node ^22.22.2 || ^24.15.0 || >=26.0.0, past
      # what .nvmrc pins (22.20.0) — the same trap turnbase-frontend hit on IMP-M0-05; npm
      # only warns (EBADENGINE) rather than failing, so the wrong version installs silently.
      - dependency-name: jsdom
        versions: ['>=30.0.0']
    groups:
      lint-format:
        patterns:
          - eslint*
          - '@typescript-eslint/*'
          - typescript-eslint
          - prettier
      build-test:
        patterns:
          - tsup
          - vitest
          - '@vitest/*'
          - jsdom

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
