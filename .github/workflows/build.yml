# Build and test checks for turnbase-sdk.
#
# IMP-M0-02 owns this file's two jobs. IMP-M0-11 adds the `scan` job below and `publish.yml`
# alongside this file — Trivy scan, publish to Maven Central + npm on tag.
#
# master everywhere, never main (conventions.md §4). There is no buf job here: nothing in
# this repository is generated from the proto (turnbase-sdk/CLAUDE.md) — the guard on a
# breaking change in this artifact is a person, not a tool.
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM CE 21
        # NOT actions/setup-java: it has no graalvm-community distribution and fails with
        # "No supported distribution was found for input graalvm-community" (IMP-M0-01).
        # GraalVM CE is set up by GraalVM's own action, and the toolchain is pinned to
        # 21.0.2-graalce in .sdkmanrc, so CI and a developer's shell run the same JDK.
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        # Spotless and Checkstyle run at validate, Error Prone and NullAway during compile,
        # JaCoCo's merged check at verify — so this one command is the whole Java gate.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan — dependencies
        # One scan per target (IMP-M20-13): every severity lands in one JSON result, which is
        # the report (summary below, artifact) and the gate (next step). platform-operations.md
        # FR-CICD-010: all findings are reported, only a critical one blocks the build.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: "LOW,MEDIUM,HIGH,CRITICAL"
          format: json
          output: trivy-deps.json
          exit-code: "0"

      - name: Trivy report and gate — dependencies
        run: |
          jq -r '[.Results[]? | .Target as $t | .Vulnerabilities[]? | {s: .Severity, t: $t, id: .VulnerabilityID, p: .PkgName, v: .InstalledVersion}]
            | group_by(.s) | map("\(.[0].s): \(length)") | .[]' trivy-deps.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | select(.Severity=="CRITICAL")
            | "CRITICAL \(.VulnerabilityID) \(.PkgName)@\(.InstalledVersion) (\($t))"' trivy-deps.json
          test "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-deps.json)" -eq 0

  # IMP-M21-03 (D7): the gitleaks CLI over the full history, pinned. Not gitleaks-action, which
  # needs a licence key for organisation repositories.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks — full history
        # The container runs as root over a runner-owned checkout, so git needs safe.directory.
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.28.0
          -c "git config --global --add safe.directory /repo &&
          gitleaks git --no-banner --redact --verbose /repo"
